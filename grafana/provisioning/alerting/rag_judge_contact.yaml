# Grafana alerting provisioning pointer (örnek)
# Gerçek ortamda contact points + notification policies ayrıca tanımlanır.
# Silence-burn rule group lives in folder "RAG Silence Burn" and is routed
# via grafana_folder matcher (see grafana/alerting/rag_inhibit_equal_canary.yaml).
apiVersion: 1

policies:
  - orgId: 1
    receiver: rag-slack
    group_by: ["grafana_folder", "alertname"]
    routes:
      - receiver: rag-silence-burn-slack
        group_by: ["grafana_folder", "alertname"]
        object_matchers:
          - ["grafana_folder", "=", "RAG Silence Burn"]
        continue: false
      - receiver: rag-silence-burn-slack
        group_by: ["alertname"]
        object_matchers:
          - ["grafana_folder", "=", "rag-silence-burn"]
        continue: false
      - receiver: rag-silence-burn-slack
        group_by: ["alertname"]
        object_matchers:
          - ["alertname", "=", "RagInhibitEqualCanarySilenceBurn"]
        continue: false

contactPoints:
  - orgId: 1
    name: rag-slack
    receivers:
      - uid: rag-slack-webhook
        type: slack
        settings:
          url: ${RAG_JUDGE_SLACK_WEBHOOK}
          title: RAG Alert
          text: "{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}"
        disableResolveMessage: false
  - orgId: 1
    name: rag-silence-burn-slack
    receivers:
      - uid: rag-silence-burn-slack-webhook
        type: slack
        settings:
          url: ${RAG_SILENCE_BURN_SLACK_WEBHOOK}
          title: RAG Silence Burn
          text: "{{ range .Alerts }}{{ .Annotations.summary }} · {{ .Annotations.runbook_url }}{{ end }}"
        disableResolveMessage: false
