# Grafana unified alerting — inhibit equal canary resolve
apiVersion: 1

groups:
  - orgId: 1
    name: rag-inhibit-equal
    folder: RAG
    interval: 5m
    rules:
      - uid: rag-inhibit-equal-canary-resolve-fail
        title: RAG inhibit equal canary resolve fail
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: increase(rag_inhibit_equal_canary_resolve_total{result="fail"}[1h])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Inhibit equal canary resolve failed
          description: >
            Canary resolve fail increase > 0 in 1h.
            Dashboard: rag-judge (Inhibit equal canary resolve panel).
            CI: scripts/ci_inhibit_equal_apply.py close-on-green / thread resolve.
        labels:
          severity: warning
          service: rag
          team: rag
      - uid: rag-inhibit-equal-canary-resolve-fail-burst
        title: RAG inhibit equal canary resolve fail burst
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(rag_inhibit_equal_canary_resolve_total{result="fail"}[6h]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gte
                    params: [3]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: Inhibit equal canary resolve fail burst
          description: >
            ≥3 canary resolve failures in 6h.
            Check Slack thread / webhook close path and CI inhibit-equal canary.
        labels:
          severity: critical
          service: rag
          team: rag
