# Grafana unified alerting — inhibit equal canary resolve
apiVersion: 1

groups:
  - orgId: 1
    name: rag-inhibit-equal
    folder: RAG
    interval: 5m
    rules:
      - uid: rag-inhibit-equal-canary-resolve-fail
        title: RAG inhibit equal canary resolve fail
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: increase(rag_inhibit_equal_canary_resolve_total{result="fail"}[1h])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Inhibit equal canary resolve failed
          description: >
            Canary resolve fail increase > 0 in 1h.
            Dashboard: rag-judge (Inhibit equal canary resolve panel).
            CI: scripts/ci_inhibit_equal_apply.py close-on-green / thread resolve.
        labels:
          severity: warning
          service: rag
          team: rag
      - uid: rag-inhibit-equal-canary-resolve-fail-burst
        title: RAG inhibit equal canary resolve fail burst
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(rag_inhibit_equal_canary_resolve_total{result="fail"}[6h]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gte
                    params: [3]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: Inhibit equal canary resolve fail burst
          description: >
            ≥3 canary resolve failures in 6h.
            Check Slack thread / webhook close path and CI inhibit-equal canary.
        labels:
          severity: critical
          service: rag
          team: rag

  # Silence-burn lives in a dedicated Grafana folder so folder-scoped
  # notification policies / contact points route independently of resolve canaries.
  - orgId: 1
    name: rag-inhibit-equal-silence-burn
    folder: RAG Silence Burn
    interval: 5m
    rules:
      - uid: rag-inhibit-equal-canary-silence-burn
        title: RAG inhibit equal canary silence burn-rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                (
                  (
                    sum(increase(rag_inhibit_equal_canary_silence_total{result="fail"}[1h]))
                    /
                    clamp_min(sum(increase(rag_inhibit_equal_canary_silence_total[1h])), 1)
                  ) > 0.2
                  and sum(increase(rag_inhibit_equal_canary_silence_total[1h])) >= 3
                )
                or
                (
                  (
                    sum(increase(rag_inhibit_equal_canary_silence_total{result="fail"}[6h]))
                    /
                    clamp_min(sum(increase(rag_inhibit_equal_canary_silence_total[6h])), 1)
                  ) > 0.1
                  and sum(increase(rag_inhibit_equal_canary_silence_total[6h])) >= 5
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: Inhibit equal canary silence burn-rate
          description: >
            Silence fail ratio elevated (1h or 6h window).
            Dashboard: rag-judge (Inhibit equal canary silence panel).
            Runbook: /ops/silence-burn (amtool: /ops/amtool).
            Opsgenie deep-link: app.opsgenie.com/alert/list?query=alias:"rag-judge-soft-fail/inhibit-equal-canary"
            (INHIBIT_EQUAL_CANARY_OPSGENIE_ALERT_URL).
            Slack canary button + PagerDuty/Opsgenie details.runbook_url
            (INHIBIT_EQUAL_CANARY_PD_RUNBOOK_URL).
            Grafana folder "RAG Silence Burn" owns routing for this rule group
            (folder-scoped contact / notification policy + Alertmanager
            exclusive folder receiver policy: group_wait=15s, group_interval=2m,
            repeat_interval=1h, continue=false).
            python -m rag.cli alertmanager --list-silences
            python -m rag.cli alertmanager --check-config
            Check INHIBIT_EQUAL_CANARY_AUTO_SILENCE + Alertmanager silences API.
          runbook_url: /ops/silence-burn
          opsgenie_url: https://app.opsgenie.com/alert/list?query=alias%3A%22rag-judge-soft-fail%2Finhibit-equal-canary%22
        labels:
          severity: critical
          service: rag
          team: rag
          grafana_folder: rag-silence-burn
          alertname: RagInhibitEqualCanarySilenceBurn
