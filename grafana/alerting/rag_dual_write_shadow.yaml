# Grafana unified alerting — dual-write shadow overlap trend
apiVersion: 1

groups:
  - orgId: 1
    name: rag-dual-write
    folder: RAG
    interval: 5m
    rules:
      - uid: rag-dual-write-shadow-overlap-low
        title: RAG dual-write shadow overlap low
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: avg(avg_over_time(rag_vector_dual_write_shadow_overlap[1h]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.95]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          summary: Dual-write shadow overlap trend düşük
          description: >
            1h ortalama shadow overlap 0.95 altına düştü.
            CLI: migrate-vector --shadow-compare --auto-catch-up-on-fail
        labels:
          severity: warning
          service: rag-ingest
          team: rag
