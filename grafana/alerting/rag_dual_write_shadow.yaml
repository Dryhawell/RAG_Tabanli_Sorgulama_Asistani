# Grafana unified alerting — dual-write lag + shadow burn-rate
apiVersion: 1

groups:
  - orgId: 1
    name: rag-dual-write
    folder: RAG
    interval: 5m
    rules:
      - uid: rag-dual-write-shadow-overlap-low
        title: RAG dual-write shadow overlap low
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: avg(avg_over_time(rag_vector_dual_write_shadow_overlap[1h]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.95]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 30m
        annotations:
          summary: Dual-write shadow overlap trend düşük
          description: >
            1h ortalama shadow overlap 0.95 altına düştü.
            CLI: migrate-vector --shadow-compare --auto-catch-up-on-fail
        labels:
          severity: warning
          service: rag-ingest
          team: rag
      - uid: rag-dual-write-lag-shadow-burn
        title: RAG dual-write lag + shadow burn-rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (
                  avg(avg_over_time(rag_vector_dual_write_lag[1h])) > 5
                  and avg(clamp_min(1 - avg_over_time(rag_vector_dual_write_shadow_overlap[1h]), 0)) > 0.05
                )
                or
                (
                  avg(avg_over_time(rag_vector_dual_write_lag[6h])) > 3
                  and avg(clamp_min(1 - avg_over_time(rag_vector_dual_write_shadow_overlap[6h]), 0)) > 0.03
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 15m
        annotations:
          summary: Dual-write lag + shadow burn-rate
          description: >
            Lag ve shadow overlap burn birlikte tetiklendi.
            Catch-up + shadow-compare --auto-catch-up-on-fail
        labels:
          severity: critical
          service: rag-ingest
          team: rag
      - uid: rag-dual-write-dlq-quarantine-depth
        title: RAG dual-write DLQ quarantine depth
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: rag_dual_write_webhook_dlq_quarantine_depth
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gte
                    params: [1]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: Dual-write DLQ quarantine not empty
          description: >
            Quarantine depth ≥ 1. Dashboard: rag-judge (DLQ quarantine panel).
            Inspect: python -m rag.cli dual-write-dlq --quarantine --notify
            Replay: python -m rag.cli dual-write-dlq --replay-quarantine
            Prune: python -m rag.cli dual-write-dlq --prune-quarantine --notify
        labels:
          severity: warning
          service: rag-ingest
          team: rag
