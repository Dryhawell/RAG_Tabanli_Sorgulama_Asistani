services:
  rag-ui:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./indexes:/app/indexes
      - ./metadata:/app/metadata
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - RAG_VECTOR_BACKEND=${RAG_VECTOR_BACKEND:-faiss}
      - RAG_QDRANT_URL=${RAG_QDRANT_URL:-}
      - RAG_UI_LANG=${RAG_UI_LANG:-tr}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    profiles:
      - qdrant

  # Observability stack (opsiyonel): docker compose --profile obs up -d
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["obs"]
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./grafana/rules:/etc/prometheus/rules:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["obs"]
    ports:
      - "9093:9093"
    volumes:
      - ./grafana/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./scripts/render_alertmanager_config.sh:/render.sh:ro
      - alertmanager_cfg:/etc/alertmanager
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache gettext >/dev/null 2>&1 || true
        TEMPLATE=/etc/alertmanager/alertmanager.yml.template \
        OUTPUT=/etc/alertmanager/alertmanager.yml \
        ALERTMANAGER_TEMPLATE=/etc/alertmanager/alertmanager.yml.template \
        ALERTMANAGER_OUTPUT=/etc/alertmanager/alertmanager.yml \
        /render.sh
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager
    environment:
      RAG_ALERTMANAGER_SLACK_WEBHOOK: ${RAG_ALERTMANAGER_SLACK_WEBHOOK:-}
      RAG_ALERTMANAGER_WEBHOOK_URL: ${RAG_ALERTMANAGER_WEBHOOK_URL:-http://host.docker.internal:9999/alertmanager-default}
      ALERTMANAGER_RELOAD_URL: ${ALERTMANAGER_RELOAD_URL:-http://127.0.0.1:9093/-/reload}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["obs"]
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./grafana/tempo.yaml:/etc/tempo.yaml:ro

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["obs"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
      - alertmanager

volumes:
  qdrant_data:
  alertmanager_cfg:
