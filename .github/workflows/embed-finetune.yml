"""Periyodik embedding fine-tuning CI workflow."""

name: Embed Fine-tune

on:
  schedule:
    - cron: "0 4 * * 1"  # Her Pazartesi 04:00 UTC
  workflow_dispatch:
    inputs:
      embedding:
        description: "Embedding preset veya model"
        required: false
        default: "mini-en"
        type: string
      epochs:
        description: "Eğitim epoch sayısı"
        required: false
        default: "1"
        type: string
      pairs_only:
        description: "Yalnızca çift üret (eğitim yok)"
        required: false
        default: false
        type: boolean

jobs:
  embed-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Embedding pipeline
        env:
          PAIRS_ONLY: ${{ inputs.pairs_only }}
        run: |
          set -e
          python -m rag.cli domain-collect --output metadata/domain_training/pairs.jsonl || true
          python -m rag.cli federated-pool --output metadata/federated/training_pool.jsonl || true
          if [ "$PAIRS_ONLY" = "true" ]; then
            python -m rag.cli embed-pipeline --pairs-only \
              --pairs metadata/embed_pairs.jsonl \
              --report metadata/embed_pipeline_report.json
          else
            python -m rag.cli embed-pipeline \
              --embedding "${{ inputs.embedding || 'mini-en' }}" \
              --epochs "${{ inputs.epochs || '1' }}" \
              --output models/ci-embed-finetuned \
              --collected-pairs metadata/domain_training/pairs.jsonl \
              --federated-pool metadata/federated/training_pool.jsonl \
              --report metadata/embed_pipeline_report.json \
              --min-accuracy 0.0
          fi
      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embed-pipeline-${{ github.run_id }}
          path: |
            metadata/embed_pairs.jsonl
            metadata/embed_pipeline_report.json
            models/ci-embed-finetuned/
          if-no-files-found: ignore
