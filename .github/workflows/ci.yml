name: CI

on:
  push:
    branches: [main, rag_assitant_roadmap_talha]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_slow_eval:
        description: "Gerçek embedding ile slow eval çalıştır"
        required: false
        default: "false"
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fast tests
        run: pytest -q -m "not slow"

  slow-eval:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_slow_eval }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Slow embedding regression
        env:
          RUN_SLOW_EVAL: "1"
        run: |
          pytest -q -m slow
          python -m rag.cli eval --embedding mini-en --min-accuracy 0.8
