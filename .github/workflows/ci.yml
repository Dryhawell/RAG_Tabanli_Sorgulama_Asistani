name: CI

on:
  push:
    branches: [main, rag_assitant_roadmap_talha]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_slow_eval:
        description: "Gerçek embedding ile slow eval çalıştır"
        required: false
        default: "false"
        type: boolean
      run_judge_llm:
        description: "LLM-as-judge gate (OpenAI/Ollama secrets gerekir)"
        required: false
        default: "false"
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fast tests
        run: pytest -q -m "not slow"
      - name: Judge gate (heuristic)
        env:
          RAG_JUDGE_MODE: heuristic
          RAG_JUDGE_MIN_ACCURACY: "1.0"
          RAG_JUDGE_OUTPUT: metadata/judge_report.json
          RAG_JUDGE_METRICS_PATH: metadata/metrics.jsonl
        run: python scripts/ci_judge.py
      - name: Judge soft-fail Slack alert
        if: always()
        env:
          RAG_JUDGE_OUTPUT: metadata/judge_report.json
          RAG_JUDGE_METRICS_PATH: metadata/metrics.jsonl
          RAG_JUDGE_SOFT_FAIL: ${{ vars.RAG_JUDGE_SOFT_FAIL || '0' }}
          RAG_JUDGE_SLACK_WEBHOOK: ${{ secrets.RAG_JUDGE_SLACK_WEBHOOK }}
        run: python scripts/ci_judge_slack_alert.py
      - name: Upload judge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-report-${{ github.run_id }}
          path: |
            metadata/judge_report.json
            metadata/metrics.jsonl
          if-no-files-found: ignore
      - name: LoRA rollback PR status artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LORA_PR_STATUS_POST: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          LORA_PR_COMMENT_POST: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          LORA_PR_STATUS_FAIL_ON_ROLLBACK: "0"
        run: |
          python scripts/ci_lora_rollback.py || true
          python scripts/ci_lora_pr_status.py
      - name: Upload LoRA PR status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lora-pr-status-${{ github.run_id }}
          path: |
            metadata/lora_rollback.json
            metadata/lora_pr_status.json
            metadata/lora_pr_comment.md
          if-no-files-found: ignore
      - name: Embed pairs smoke
        run: |
          python -m rag.cli embed-pipeline --pairs-only \
            --pairs metadata/embed_pairs.jsonl \
            --report metadata/embed_pipeline_report.json

  slow-eval:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_slow_eval }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Slow embedding regression
        env:
          RUN_SLOW_EVAL: "1"
          RAG_LORA_DP_EVAL_MIN_ACCURACY: "0.8"
          RAG_LORA_DP_EVAL_MIN_DELTA: "0.0"
        run: |
          pytest -q -m slow
          python -m rag.cli eval --embedding mini-en --min-accuracy 0.8

  judge-llm:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_judge_llm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Judge gate (llm)
        env:
          RAG_JUDGE_MODE: llm
          RAG_JUDGE_PROVIDER: ${{ vars.RAG_JUDGE_PROVIDER || 'openai' }}
          RAG_JUDGE_MODEL: ${{ vars.RAG_JUDGE_MODEL || 'gpt-4o-mini' }}
          RAG_JUDGE_MIN_ACCURACY: ${{ vars.RAG_JUDGE_MIN_ACCURACY || '1.0' }}
          RAG_JUDGE_SOFT_FAIL: ${{ vars.RAG_JUDGE_SOFT_FAIL || '1' }}
          RAG_JUDGE_OUTPUT: metadata/judge_report_llm.json
          RAG_JUDGE_METRICS_PATH: metadata/metrics.jsonl
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$OLLAMA_HOST" ]; then
            echo "OPENAI_API_KEY veya OLLAMA_HOST secret gerekli — atlanıyor"
            exit 0
          fi
          python scripts/ci_judge.py
      - name: Judge soft-fail Slack alert (llm)
        if: always()
        env:
          RAG_JUDGE_OUTPUT: metadata/judge_report_llm.json
          RAG_JUDGE_METRICS_PATH: metadata/metrics.jsonl
          RAG_JUDGE_SOFT_FAIL: ${{ vars.RAG_JUDGE_SOFT_FAIL || '1' }}
          RAG_JUDGE_SLACK_WEBHOOK: ${{ secrets.RAG_JUDGE_SLACK_WEBHOOK }}
        run: python scripts/ci_judge_slack_alert.py
      - name: Upload LLM judge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-report-llm-${{ github.run_id }}
          path: |
            metadata/judge_report_llm.json
            metadata/metrics.jsonl
          if-no-files-found: ignore
