"""Judge ack audit weekly digest (Slack) — tenant fan-out + quiet hours + retention prune."""

name: Judge Ack Digest

on:
  schedule:
    - cron: "0 9 * * 1"  # Pazartesi 09:00 UTC
  workflow_dispatch:
    inputs:
      hours:
        description: "Özet penceresi (saat)"
        required: false
        default: "168"
        type: string
      dry_run:
        description: "Webhook göndermeden özet"
        required: false
        default: false
        type: boolean
      force:
        description: "Quiet hours'ı yok say"
        required: false
        default: false
        type: boolean
      fan_out:
        description: "Tenant webhook fan-out"
        required: false
        default: true
        type: boolean
      prune:
        description: "Digest öncesi retention purge"
        required: false
        default: true
        type: boolean

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Judge ack digest
        env:
          RAG_JUDGE_SLACK_WEBHOOK: ${{ secrets.RAG_JUDGE_SLACK_WEBHOOK }}
          RAG_JUDGE_ACK_DIGEST_WEBHOOKS_JSON: ${{ secrets.RAG_JUDGE_ACK_DIGEST_WEBHOOKS_JSON }}
          RAG_JUDGE_ACK_DIGEST_QUIET_HOURS: ${{ vars.RAG_JUDGE_ACK_DIGEST_QUIET_HOURS }}
          RAG_JUDGE_ACK_DIGEST_QUIET_HOURS_JSON: ${{ secrets.RAG_JUDGE_ACK_DIGEST_QUIET_HOURS_JSON }}
          RAG_JUDGE_ACK_DIGEST_TIMEZONE: ${{ vars.RAG_JUDGE_ACK_DIGEST_TIMEZONE || 'UTC' }}
          RAG_JUDGE_ACK_AUDIT: metadata/judge_ack_audit.jsonl
          RAG_JUDGE_ACK_AUDIT_RETENTION_DAYS: ${{ vars.RAG_JUDGE_ACK_AUDIT_RETENTION_DAYS || '90' }}
          RAG_JUDGE_ACK_AUDIT_KEEP: ${{ vars.RAG_JUDGE_ACK_AUDIT_KEEP || '10000' }}
          RAG_JUDGE_ACK_AUDIT_PRUNE: ${{ (github.event_name != 'workflow_dispatch' || inputs.prune) && '1' || '0' }}
          RAG_JUDGE_ACK_DIGEST_MUTE_TTL_DAYS: ${{ vars.RAG_JUDGE_ACK_DIGEST_MUTE_TTL_DAYS || '30' }}
          RAG_JUDGE_ACK_DIGEST_PREFS_RETENTION_DAYS: ${{ vars.RAG_JUDGE_ACK_DIGEST_PREFS_RETENTION_DAYS || '90' }}
          RAG_JUDGE_ACK_DIGEST_MESSAGES: metadata/judge_ack_digest_messages.json
          RAG_JUDGE_ACK_DIGEST_MESSAGES_TTL_DAYS: ${{ vars.RAG_JUDGE_ACK_DIGEST_MESSAGES_TTL_DAYS || '30' }}
          RAG_JUDGE_ACK_DIGEST_MESSAGES_PRUNE: ${{ (github.event_name != 'workflow_dispatch' || inputs.prune) && '1' || '0' }}
          RAG_JUDGE_ACK_DIGEST_MUTE_PRUNE: ${{ (github.event_name != 'workflow_dispatch' || inputs.prune) && '1' || '0' }}
          RAG_JUDGE_ACK_DIGEST_HISTORY_RECONCILE: ${{ (github.event_name != 'workflow_dispatch' || inputs.prune) && '1' || '0' }}
          RAG_JUDGE_SLACK_BOT_TOKEN: ${{ secrets.RAG_JUDGE_SLACK_BOT_TOKEN }}
        run: |
          mkdir -p metadata
          EXTRA="--prune-mutes --reconcile-messages"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="$EXTRA --dry-run"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            EXTRA="$EXTRA --force"
          fi
          FANOUT="--fan-out"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.fan_out }}" = "false" ]; then
            FANOUT=""
          fi
          HOURS="${{ inputs.hours || '168' }}"
          # shellcheck disable=SC2086
          python -m rag.cli judge-ack-digest --hours "$HOURS" $FANOUT $EXTRA \
            | tee metadata/judge_ack_digest.json
      - name: Export mute snapshots
        id: mute_export
        env:
          RAG_JUDGE_SLACK_BOT_TOKEN: ${{ secrets.RAG_JUDGE_SLACK_BOT_TOKEN }}
          RAG_JUDGE_ACK_DIGEST_MUTE_UPLOAD_CHANNEL: ${{ vars.RAG_JUDGE_ACK_DIGEST_MUTE_UPLOAD_CHANNEL }}
          RAG_JUDGE_ACK_DIGEST_MUTE_EXPORT_PRUNE: ${{ vars.RAG_JUDGE_ACK_DIGEST_MUTE_EXPORT_PRUNE || '1' }}
          RAG_JUDGE_ACK_DIGEST_MUTE_EXPORT_RETENTION_DAYS: ${{ vars.RAG_JUDGE_ACK_DIGEST_MUTE_EXPORT_RETENTION_DAYS || '30' }}
          RAG_JUDGE_ACK_DIGEST_MUTE_EXPORT_KEEP: ${{ vars.RAG_JUDGE_ACK_DIGEST_MUTE_EXPORT_KEEP || '50' }}
          RAG_JUDGE_ACK_DIGEST_MUTE_EXPORT_SIGNING_SECRET: ${{ secrets.RAG_JUDGE_ACK_DIGEST_MUTE_EXPORT_SIGNING_SECRET || secrets.RAG_JUDGE_ACK_TOKEN }}
          RAG_JUDGE_ACK_DIGEST_MUTE_EXPORT_SWEEP: ${{ vars.RAG_JUDGE_ACK_DIGEST_MUTE_EXPORT_SWEEP || '1' }}
          RAG_JUDGE_ACK_DIGEST_MUTE_EXPORT_SWEEP_REVOKED_DAYS: ${{ vars.RAG_JUDGE_ACK_DIGEST_MUTE_EXPORT_SWEEP_REVOKED_DAYS || '7' }}
          RAG_JUDGE_ACK_PUBLIC_URL: ${{ vars.RAG_JUDGE_ACK_PUBLIC_URL }}
          RAG_JUDGE_ACK_DIGEST_BASE: metadata
        run: |
          mkdir -p metadata/mute_exports
          python -m rag.cli judge-ack-digest \
            --export-mute-snapshots \
            --export-format csv \
            --export-output metadata/judge_ack_digest_mute_snapshots.csv \
            --prune-mute-exports \
            --sweep-mute-export-urls \
            --sign-mute-export \
            | tee metadata/judge_ack_digest_mute_export.json
          if [ -n "${RAG_JUDGE_SLACK_BOT_TOKEN}" ]; then
            EXTRA_UPLOAD=""
            if [ -n "${RAG_JUDGE_ACK_DIGEST_MUTE_UPLOAD_CHANNEL}" ]; then
              EXTRA_UPLOAD="--upload-channel ${RAG_JUDGE_ACK_DIGEST_MUTE_UPLOAD_CHANNEL}"
            fi
            # shellcheck disable=SC2086
            python -m rag.cli judge-ack-digest --upload-mute-snapshots --export-format csv \
              --prune-mute-exports \
              --sweep-mute-export-urls \
              $EXTRA_UPLOAD \
              | tee metadata/judge_ack_digest_mute_upload.json
          else
            echo '{"ok":true,"skipped":true,"reason":"no_bot_token"}' \
              | tee metadata/judge_ack_digest_mute_upload.json
          fi
      - name: Upload digest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-ack-digest
          path: |
            metadata/judge_ack_digest.json
            metadata/judge_ack_audit.jsonl
            metadata/judge_ack_digest_last.json
            metadata/judge_ack_digest_messages.json
            metadata/judge_ack_digest_mute_snapshots.csv
            metadata/judge_ack_digest_mute_export.json
            metadata/judge_ack_digest_mute_upload.json
            metadata/mute_exports/
            metadata/mute_export_signed_urls.json
          if-no-files-found: ignore
