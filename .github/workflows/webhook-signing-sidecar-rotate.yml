# Dual-write quarantine HMAC signing sidecar PEM rotate (if expiring).

name: Webhook Signing Sidecar Cert Rotate

on:
  schedule:
    - cron: "0 4 * * *"  # her gün 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Yazmadan rotate planı"
        required: false
        default: false
        type: boolean
      force:
        description: "Warn eşiğini yok say (her zaman rotate)"
        required: false
        default: false
        type: boolean
      cert_days:
        description: "Yeni PEM geçerlilik (gün)"
        required: false
        default: "90"
        type: string

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore sidecar TLS cache
        uses: actions/cache@v4
        with:
          path: metadata/sidecar-tls
          key: webhook-signing-sidecar-tls-${{ github.repository }}
          restore-keys: |
            webhook-signing-sidecar-tls-
      - name: Rotate sidecar certs if expiring
        env:
          RAG_WEBHOOK_SIGNING_SIDECAR_TLS_DIR: metadata/sidecar-tls
          RAG_WEBHOOK_SIGNING_SIDECAR_TLS_CERT: metadata/sidecar-tls/server.crt
          RAG_WEBHOOK_SIGNING_SIDECAR_TLS_KEY: metadata/sidecar-tls/server.key
          RAG_WEBHOOK_SIGNING_SIDECAR_TLS_CA: metadata/sidecar-tls/ca.crt
          RAG_WEBHOOK_SIGNING_SIDECAR_UPSTREAM_CLIENT_CERT: metadata/sidecar-tls/client.crt
          RAG_WEBHOOK_SIGNING_SIDECAR_UPSTREAM_CLIENT_KEY: metadata/sidecar-tls/client.key
          RAG_WEBHOOK_SIGNING_SIDECAR_CERT_EXPIRY_WARN_DAYS: ${{ vars.RAG_WEBHOOK_SIGNING_SIDECAR_CERT_EXPIRY_WARN_DAYS || '14' }}
          RAG_WEBHOOK_SIGNING_SIDECAR_ROTATE_NOTIFY: ${{ vars.RAG_WEBHOOK_SIGNING_SIDECAR_ROTATE_NOTIFY || '1' }}
          RAG_WEBHOOK_SIGNING_SIDECAR_ROTATE_SLACK_WEBHOOK: ${{ secrets.RAG_WEBHOOK_SIGNING_SIDECAR_ROTATE_SLACK_WEBHOOK || secrets.RAG_DUAL_WRITE_DLQ_QUARANTINE_SLACK_WEBHOOK }}
          RAG_WEBHOOK_SIGNING_SIDECAR_ROTATE_PD_NOTIFY: ${{ vars.RAG_WEBHOOK_SIGNING_SIDECAR_ROTATE_PD_NOTIFY || '1' }}
          RAG_WEBHOOK_SIGNING_SIDECAR_ROTATE_PAGERDUTY_ROUTING_KEY: ${{ secrets.RAG_WEBHOOK_SIGNING_SIDECAR_ROTATE_PAGERDUTY_ROUTING_KEY || secrets.RAG_JUDGE_PAGERDUTY_ROUTING_KEY }}
          RAG_WEBHOOK_SIGNING_SIDECAR_ROTATE_PD_SEVERITY: ${{ vars.RAG_WEBHOOK_SIGNING_SIDECAR_ROTATE_PD_SEVERITY || 'error' }}
          RAG_WEBHOOK_SIGNING_SIDECAR_ROTATE_PD_SEVERITY_BY_ERROR: ${{ vars.RAG_WEBHOOK_SIGNING_SIDECAR_ROTATE_PD_SEVERITY_BY_ERROR || '' }}
        run: |
          mkdir -p metadata/sidecar-tls
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="$EXTRA --dry-run"
          fi
          CERT_DAYS="${{ inputs.cert_days || '90' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            MODE="--rotate-certs"
          else
            MODE="--rotate-certs-if-expiring"
          fi
          # shellcheck disable=SC2086
          python -m rag.cli webhook-signing-sidecar $MODE --cert-days "$CERT_DAYS" --notify $EXTRA \
            | tee metadata/sidecar_cert_rotate.json
          python -m rag.cli webhook-signing-sidecar --check-certs \
            | tee metadata/sidecar_cert_check.json || true
      - name: Upload rotate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webhook-signing-sidecar-cert-rotate
          path: |
            metadata/sidecar_cert_rotate.json
            metadata/sidecar_cert_check.json
            metadata/sidecar-tls/
          if-no-files-found: ignore
